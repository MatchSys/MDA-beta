<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace & Tickets</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-subtle: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --success: #238636;
      --danger: #da3633;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .auth-container {
      max-width: 360px;
      margin: 80px auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }

    .auth-container h2 {
      margin-top: 0;
      color: var(--text-bright);
      font-size: 1.2rem;
      text-align: center;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-bar h1 {
      font-size: 1.15rem;
      color: var(--text-bright);
      margin: 0;
      font-weight: 600;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input, textarea {
      background: var(--card-subtle);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--card-subtle);
      color: var(--text-bright);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-danger {
      color: var(--danger);
    }
    .btn-danger:hover {
      background: rgba(218, 54, 51, 0.1);
      border-color: var(--danger);
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .search-box input {
      flex: 1;
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      border: 1px solid transparent;
      border-bottom: none;
      font-size: 0.85rem;
    }

    .tab.active {
      background: var(--card-bg);
      color: var(--text-bright);
      border-color: var(--border);
      font-weight: 500;
      border-top: 2px solid var(--accent);
    }

    .tab .close-tab {
      color: var(--text-muted);
      font-size: 1rem;
      padding: 0 2px;
      line-height: 1;
    }

    .tab .close-tab:hover {
      color: var(--danger);
    }

    .workspace {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .workspace-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .workspace-header h2 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--text-bright);
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }

    .checklist-container {
      background: var(--card-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .checklist-input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .checklist-item:last-child {
      border-bottom: none;
    }

    .checklist-item input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent);
    }

    .checklist-text {
      flex: 1;
      font-size: 0.9rem;
    }

    .checklist-item.done .checklist-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 10px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid transparent;
    }

    .card-header.open {
      border-bottom-color: var(--border);
    }

    .card-title-input {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      font-weight: 600;
      color: var(--text-bright);
      padding: 4px 6px;
    }

    .card-title-input:focus {
      background: var(--bg);
      border-color: var(--accent);
    }

    .ticket-input-inline {
      width: 130px;
      font-size: 0.85rem;
      padding: 4px 8px;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-body.hidden {
      display: none;
    }

    textarea {
      width: 100%;
      height: 65px;
      resize: vertical;
    }

    .line-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-subtle);
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      gap: 10px;
    }

    .line-text {
      flex: 1;
      font-size: 0.9rem;
    }

    .actions-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .sync-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- VISTA DE LOGIN -->
  <div id="authView" class="auth-container">
    <h2>Iniciar Sesión</h2>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <input type="email" id="authEmail" placeholder="tu@email.com">
      <input type="password" id="authPassword" placeholder="Contraseña">
      <button class="btn-primary" onclick="handleAuth('login')">Entrar</button>
      <button onclick="handleAuth('signup')">Registrarme</button>
      <div id="authError" style="color: var(--danger); font-size: 0.8rem; text-align: center;"></div>
    </div>
  </div>

  <!-- VISTA PRINCIPAL DE LA APP -->
  <div id="appView" style="display: none;">
    <div class="header-bar">
      <div>
        <h1>Workspace Personal</h1>
        <span class="sync-status" id="syncStatus">● Sincronizado</span>
      </div>
      <div class="user-pill">
        <span id="userDisplay"></span>
        <button onclick="logout()">Salir</button>
      </div>
    </div>

    <!-- Buscador de Complejo -->
    <div class="search-box">
      <input type="text" id="complexInput" placeholder="Código de complejo (ej: 2008, 0733)..." maxlength="4" onkeypress="if(event.key==='Enter') createNewTab()">
      <button class="btn-primary" onclick="createNewTab()">+ Abrir Complejo</button>
    </div>

    <!-- Solapas -->
    <div class="tabs" id="tabsContainer"></div>

    <!-- Workspace Activo -->
    <div class="workspace" id="workspace">
      <div class="workspace-header">
        <h2 id="currentTitle">Notas / Bitácora</h2>
      </div>

      <!-- SECCIÓN EXCLUSIVA DE NOTAS -->
      <div id="notesSpecificSection" style="display: none;">
        <span class="section-title">Checklist / Foco del Día</span>
        <div class="checklist-container">
          <div class="checklist-input-box">
            <input type="text" id="newTodoInput" placeholder="Nueva tarea pendiente..." style="flex:1;" onkeypress="if(event.key==='Enter') addTodo()">
            <button onclick="addTodo()">Agregar</button>
          </div>
          <div id="todosContainer"></div>
        </div>
      </div>

      <!-- SECCIÓN COMPLEJOS -->
      <div id="complexSection" style="display: none;">
        <span class="section-title">Relevos y Rutinas</span>
        <div id="staticLines"></div>

        <div style="margin: 16px 0;">
          <span class="section-title">Equipos / Impresoras (Pegar lista ej: KI02 SN03):</span>
          <textarea id="rawEquipments" placeholder="KI02 SN03 SN04..." oninput="processEquipments()"></textarea>
        </div>

        <span class="section-title">Limpiezas Generadas</span>
        <div id="dynamicLines"></div>
      </div>

      <!-- TARJETAS MODULARES -->
      <div style="margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span class="section-title" id="cardsSectionTitle">Notas / Tarjetas</span>
          <button onclick="addCustomLine()">+ Nueva Tarjeta</button>
        </div>
        <div id="customCardsContainer"></div>
      </div>

      <div class="actions-bar" id="complexActions" style="display: none;">
        <button class="btn-primary" onclick="copyAll()">Copiar Todo el Reporte</button>
      </div>
    </div>
  </div>

</div>

<script>
  // -------------------------------------------------------------
  // CONFIGURACIÓN DE SUPABASE
  // -------------------------------------------------------------
  const SUPABASE_URL = 'https://xlwhvmmgimeuvbvghemt.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsd2h2bW1naW1ldXZidmdoZW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2Mzc1NjUsImV4cCI6MjEwNDIxMzU2NX0.wqtbkubn-JGW671twlZFAD6bWH0TohSH2BbsoZOdSHU';

  // Usamos sbClient para que no colisione con el objeto global window.supabase
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const dbComplejos = {
    "0000": "Bitácora / Notas",
    "0732": "Palmares", "0733": "Palermo", "0734": "Caballito", "0739": "Soleil",
    "0745": "Santa Fe", "0748": "San Justo", "0749": "Malvinas", "0756": "Tortugas",
    "2000": "Unicenter", "2001": "Moron", "2002": "Quilmes", "2003": "Dot",
    "2004": "Abasto", "2005": "Temperley", "2006": "Moreno", "2007": "Salta Hoyts",
    "2008": "Nuevo Centro", "2009": "Patio Olmos", "2010": "Rosario", "2013": "Salta Cinemark",
    "2014": "Neuquen", "2015": "Avellaneda", "2016": "Parque Brown"
  };

  const noteTabId = 'tab_personal';
  let currentUser = null;
  let activeTabs = [];
  let currentTabId = noteTabId;
  let userTodos = [];
  let saveTimeout = null;

  // -------------------------------------------------------------
  // AUTENTICACIÓN
  // -------------------------------------------------------------
  async function checkSession() {
    try {
      const { data } = await sbClient.auth.getSession();
      if (data && data.session) {
        currentUser = data.session.user;
        showApp();
      } else {
        showAuth();
      }
    } catch (err) {
      console.error("Error al autenticar:", err);
      showAuth();
    }
  }

  async function handleAuth(type) {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    const errorEl = document.getElementById('authError');
    errorEl.innerText = '';

    if (!email || !password) {
      errorEl.innerText = 'Completá email y contraseña';
      return;
    }

    let result;
    if (type === 'login') {
      result = await sbClient.auth.signInWithPassword({ email, password });
    } else {
      result = await sbClient.auth.signUp({ email, password });
    }

    if (result.error) {
      errorEl.innerText = result.error.message;
    } else {
      currentUser = result.data.user;
      showApp();
    }
  }

  async function logout() {
    await sbClient.auth.signOut();
    currentUser = null;
    showAuth();
  }

  function showAuth() {
    document.getElementById('authView').style.display = 'block';
    document.getElementById('appView').style.display = 'none';
  }

  async function showApp() {
    document.getElementById('authView').style.display = 'none';
    document.getElementById('appView').style.display = 'block';
    document.getElementById('userDisplay').innerText = currentUser.email;
    await loadRemoteData();
  }

  // -------------------------------------------------------------
  // PERSISTENCIA
  // -------------------------------------------------------------
  function queueAutoSave() {
    document.getElementById('syncStatus').innerText = '○ Guardando...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveRemoteData, 800);
  }

  async function saveRemoteData() {
    if (!currentUser) return;
    const payload = {
      activeTabs: activeTabs,
      currentTabId: currentTabId,
      userTodos: userTodos
    };

    const { error } = await sbClient
      .from('user_workspace')
      .upsert({ user_id: currentUser.id, data: payload, updated_at: new Date() });

    if (!error) {
      document.getElementById('syncStatus').innerText = '● Sincronizado';
    } else {
      document.getElementById('syncStatus').innerText = '⚠ Error al guardar';
    }
  }

  async function loadRemoteData() {
    const { data, error } = await sbClient
      .from('user_workspace')
      .select('data')
      .eq('user_id', currentUser.id)
      .single();

    if (data && data.data) {
      activeTabs = data.data.activeTabs || [];
      currentTabId = data.data.currentTabId || noteTabId;
      userTodos = data.data.userTodos || [];
    }

    if (!activeTabs || activeTabs.length === 0) {
      activeTabs = [{
        id: noteTabId,
        code: "0000",
        name: "Notas / Bitácora",
        ticketsState: {},
        customLines: [
          { id: 'c_init_1', title: 'Anotaciones rápidas', text: '', ticket: '', isOpen: true }
        ],
        rawInput: ""
      }];
      currentTabId = noteTabId;
    }

    renderTabs();
    selectTab(currentTabId);
  }

  // -------------------------------------------------------------
  // TABS & LOGIC
  // -------------------------------------------------------------
  function createNewTab() {
    let rawCode = document.getElementById('complexInput').value.trim();
    if (!rawCode) return;

    const code = rawCode.padStart(4, '0');
    const name = dbComplejos[code] || "Complejo " + code;
    const tabId = 'tab_' + Date.now();

    activeTabs.push({
      id: tabId,
      code: code,
      name: name,
      ticketsState: {},
      customLines: [],
      rawInput: ""
    });

    document.getElementById('complexInput').value = '';
    selectTab(tabId);
    queueAutoSave();
  }

  function renderTabs() {
    const container = document.getElementById('tabsContainer');
    container.innerHTML = '';

    activeTabs.forEach(tab => {
      const tabEl = document.createElement('div');
      tabEl.className = `tab ${tab.id === currentTabId ? 'active' : ''}`;
      tabEl.innerHTML = `
        <span>${tab.name}</span>
        ${tab.id !== noteTabId ? `<span class="close-tab" onclick="closeTab(event, '${tab.id}')">&times;</span>` : ''}
      `;
      tabEl.onclick = () => selectTab(tab.id);
      container.appendChild(tabEl);
    });
  }

  function selectTab(tabId) {
    currentTabId = tabId;
    renderTabs();

    const tab = activeTabs.find(t => t.id === tabId);
    if (!tab) return;

    const isNotes = tab.code === "0000";
    document.getElementById('currentTitle').innerText = isNotes ? 'Bitácora & Notas Personales' : `${tab.name} (${tab.code})`;
    document.getElementById('notesSpecificSection').style.display = isNotes ? 'block' : 'none';
    document.getElementById('complexSection').style.display = isNotes ? 'none' : 'block';
    document.getElementById('complexActions').style.display = isNotes ? 'none' : 'flex';
    document.getElementById('cardsSectionTitle').innerText = isNotes ? 'Tarjetas de Apuntes' : 'Tickets Manuales / Ventanas';

    if (isNotes) {
      renderTodos();
    } else {
      document.getElementById('rawEquipments').value = tab.rawInput || "";
      renderStaticLines();
      processEquipments();
    }

    renderCustomCards();
    queueAutoSave();
  }

  function closeTab(e, tabId) {
    e.stopPropagation();
    activeTabs = activeTabs.filter(t => t.id !== tabId);
    if (currentTabId === tabId) {
      currentTabId = activeTabs[activeTabs.length - 1].id;
    }
    selectTab(currentTabId);
    queueAutoSave();
  }

  // -------------------------------------------------------------
  // CHECKLIST
  // -------------------------------------------------------------
  function addTodo() {
    const input = document.getElementById('newTodoInput');
    const text = input.value.trim();
    if (!text) return;

    userTodos.push({ id: 'todo_' + Date.now(), text, done: false });
    input.value = '';
    renderTodos();
    queueAutoSave();
  }

  function toggleTodo(id) {
    const item = userTodos.find(t => t.id === id);
    if (item) {
      item.done = !item.done;
      renderTodos();
      queueAutoSave();
    }
  }

  function removeTodo(id) {
    userTodos = userTodos.filter(t => t.id !== id);
    renderTodos();
    queueAutoSave();
  }

  function renderTodos() {
    const container = document.getElementById('todosContainer');
    container.innerHTML = '';

    userTodos.forEach(item => {
      const div = document.createElement('div');
      div.className = `checklist-item ${item.done ? 'done' : ''}`;
      div.innerHTML = `
        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleTodo('${item.id}')">
        <span class="checklist-text">${item.text}</span>
        <button class="btn-danger" style="padding:2px 6px; font-size:0.75rem;" onclick="removeTodo('${item.id}')">✕</button>
      `;
      container.appendChild(div);
    });
  }

  // -------------------------------------------------------------
  // TARJETAS / APUNTES
  // -------------------------------------------------------------
  function addCustomLine() {
    const tab = activeTabs.find(t => t.id === currentTabId);
    if (!tab) return;

    tab.customLines.push({
      id: 'c_' + Date.now(),
      title: 'Nota nueva',
      text: '',
      ticket: '',
      isOpen: true
    });

    renderCustomCards();
    queueAutoSave();
  }

  function renderCustomCards() {
    const tab = activeTabs.find(t => t.id === currentTabId);
    if (!tab) return;

    const container = document.getElementById('customCardsContainer');
    container.innerHTML = '';

    tab.customLines.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';

      const header = document.createElement('div');
      header.className = `card-header ${item.isOpen ? 'open' : ''}`;

      const titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.className = 'card-title-input';
      titleInput.value = item.title;
      titleInput.oninput = (e) => { item.title = e.target.value; queueAutoSave(); };

      const ticketInput = document.createElement('input');
      ticketInput.type = 'text';
      ticketInput.className = 'ticket-input-inline';
      ticketInput.placeholder = 'Ticket # (opcional)';
      ticketInput.value = item.ticket || '';
      ticketInput.oninput = (e) => { item.ticket = e.target.value; queueAutoSave(); };

      const btnToggle = document.createElement('button');
      btnToggle.innerText = item.isOpen ? 'Plegar' : 'Expandir';
      btnToggle.onclick = () => {
        item.isOpen = !item.isOpen;
        renderCustomCards();
        queueAutoSave();
      };

      const btnCopy = document.createElement('button');
      btnCopy.innerText = 'Copiar';
      btnCopy.onclick = () => {
        const textToCopy = item.ticket ? `${item.ticket} ${item.text}` : item.text;
        copyText(textToCopy, btnCopy);
      };

      const btnDel = document.createElement('button');
      btnDel.className = 'btn-danger';
      btnDel.innerText = '✕';
      btnDel.onclick = () => {
        tab.customLines = tab.customLines.filter(c => c.id !== item.id);
        renderCustomCards();
        queueAutoSave();
      };

      header.appendChild(titleInput);
      header.appendChild(ticketInput);
      header.appendChild(btnToggle);
      header.appendChild(btnCopy);
      header.appendChild(btnDel);

      const body = document.createElement('div');
      body.className = `card-body ${item.isOpen ? '' : 'hidden'}`;

      const textarea = document.createElement('textarea');
      textarea.placeholder = 'Escribí tus notas o cuerpo del ticket...';
      textarea.value = item.text;
      textarea.oninput = (e) => { item.text = e.target.value; queueAutoSave(); };

      body.appendChild(textarea);
      card.appendChild(header);
      card.appendChild(body);
      container.appendChild(card);
    });
  }

  // -------------------------------------------------------------
  // RUTINAS Y EQUIPOS
  // -------------------------------------------------------------
  function renderStaticLines() {
    const lines = [
      { id: 'visita', text: 'SW informa que se realizo la visita semanal de' },
      { id: 'alarmas', text: 'SW informa que se realizo el checklist de alarmas' },
      { id: 'datacenter', text: 'SW informa que se realizo el relevo de datacenter' },
      { id: 'carteleria', text: 'SW informa que se realizo el relevo de carteleria' }
    ];

    const container = document.getElementById('staticLines');
    container.innerHTML = '';
    lines.forEach(item => container.appendChild(createStandardRow(item.id, item.text)));
  }

  function processEquipments() {
    const tab = activeTabs.find(t => t.id === currentTabId);
    if (!tab || tab.code === "0000") return;

    const rawText = document.getElementById('rawEquipments').value;
    tab.rawInput = rawText;

    const matches = rawText.match(/\b[A-Za-z0-9]+\b/g) || [];
    const container = document.getElementById('dynamicLines');
    container.innerHTML = '';

    matches.forEach((item, index) => {
      const fullCode = `AR${tab.code}${item.toUpperCase()}`;
      container.appendChild(createStandardRow(`limp_eq_${index}`, `SW informa que se realizo la limpieza del equipo ${fullCode}`));
      container.appendChild(createStandardRow(`limp_imp_${index}`, `SW informa que se realizo la limpieza de la impresora del equipo ${fullCode}`));
    });

    queueAutoSave();
  }

  function createStandardRow(key, text) {
    const tab = activeTabs.find(t => t.id === currentTabId);
    const savedVal = tab && tab.ticketsState[key] ? tab.ticketsState[key] : '';

    const div = document.createElement('div');
    div.className = 'line-item';

    const span = document.createElement('span');
    span.className = 'line-text';
    span.innerText = text;

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'ticket-input-inline';
    input.placeholder = 'INC / Ticket';
    input.value = savedVal;
    input.oninput = (e) => {
      tab.ticketsState[key] = e.target.value;
      queueAutoSave();
    };

    const btn = document.createElement('button');
    btn.innerText = 'Copiar';
    btn.onclick = () => {
      const full = input.value.trim() ? `${input.value.trim()} ${text}` : text;
      copyText(full, btn);
    };

    div.appendChild(span);
    div.appendChild(input);
    div.appendChild(btn);
    return div;
  }

  function copyText(text, btnElement) {
    navigator.clipboard.writeText(text);
    if (btnElement) {
      const original = btnElement.innerText;
      btnElement.innerText = '✓ Copiado';
      btnElement.style.color = '#3fb950';
      setTimeout(() => {
        btnElement.innerText = original;
        btnElement.style.color = '';
      }, 1000);
    }
  }

  function copyAll() {
    const tab = activeTabs.find(t => t.id === currentTabId);
    if (!tab) return;

    let lines = [];
    document.querySelectorAll('#staticLines .line-item, #dynamicLines .line-item').forEach(item => {
      const text = item.querySelector('.line-text').innerText;
      const tVal = item.querySelector('.ticket-input-inline').value.trim();
      lines.push(tVal ? `${tVal} ${text}` : text);
    });

    tab.customLines.forEach(item => {
      if (item.text.trim()) {
        lines.push(item.ticket.trim() ? `${item.ticket.trim()} ${item.text.trim()}` : item.text.trim());
      }
    });

    navigator.clipboard.writeText(lines.join('\n'));
  }

  window.onload = checkSession;
</script>

</body>
</html>
